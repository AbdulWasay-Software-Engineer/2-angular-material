
<div class="task-container">
  <mat-form-field appearance="outline" class="task-field">
    <mat-label>Enter a Task</mat-label>
    <input
      matInput
      [(ngModel)]="task"
      placeholder="What needs to be done?"
    />
   
  </mat-form-field>

  <button mat-raised-button color="primary"
          class="add-btn"
          (click)="addTask()">
    Add Task
  </button>
</div>
